<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SOMOS 10-4 — Lavandería y Planchado</title>
  <desc id="desc">Logotipo moderno en azul marino y dorado para SOMOS 10-4, lavandería y planchado profesional.</desc>

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6B36A"/>
      <stop offset="1" stop-color="#A77A36"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".16"/>
    </filter>
  </defs>

  <!-- Transparent background: ready for web, print and signage -->
  <g transform="translate(42 42)" filter="url(#shadow)">
    <!-- Emblem -->
    <circle cx="168" cy="168" r="150" fill="#10233F"/>
    <circle cx="168" cy="168" r="136" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <circle cx="168" cy="168" r="122" fill="none" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="1.5"/>

    <!-- Minimal radio/wave motif -->
    <path d="M132 111 C121 99 121 84 132 72" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M204 111 C215 99 215 84 204 72" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="168" cy="96" r="5" fill="#FFFFFF"/>

    <!-- Main mark -->
    <text x="168" y="178"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="92"
          font-weight="900"
          letter-spacing="-4"
          fill="#FFFFFF">10-4</text>

    <line x1="87" y1="201" x2="249" y2="201" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>

    <text x="168" y="238"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="25"
          font-weight="800"
          letter-spacing="7"
          fill="#FFFFFF">SOMOS</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(390 91)">
    <text x="0" y="105"
          font-family="Arial, Helvetica, sans-serif"
          font-size="92"
          font-weight="900"
          letter-spacing="-3"
          fill="#10233F">SOMOS</text>

    <text x="0" y="205"
          font-family="Arial, Helvetica, sans-serif"
          font-size="108"
          font-weight="900"
          letter-spacing="-5"
          fill="url(#gold)">10-4</text>

    <rect x="2" y="232" width="500" height="4" rx="2" fill="#10233F"/>

    <text x="0" y="278"
          font-family="Arial, Helvetica, sans-serif"
          font-size="23"
          font-weight="700"
          letter-spacing="3.2"
          fill="#10233F">LAVANDERÍA · PLANCHADO</text>

    <text x="0" y="316"
          font-family="Arial, Helvetica, sans-serif"
          font-size="15"
          font-weight="500"
          letter-spacing="1.6"
          fill="#667085">SERVICIO PROFESIONAL</text>
  </g>
</svg>
